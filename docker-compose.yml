# Local stack: Postgres-with-pgvector + the Document Intelligence app + a mock Azure OCR.
#
#   docker compose up --build                 # default: raw bytes stored in Postgres (bytea)
#   BLOB_BACKEND=local docker compose up      # raw bytes on a docker volume
#   docker compose --profile s3 up --build    # raw bytes in MinIO (S3-compatible)
#
# The app applies migrations on startup (under an advisory lock) and, because this DB ships
# pgvector, creates the vector extension, embedding columns and HNSW indexes.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: di
      POSTGRES_PASSWORD: di
      POSTGRES_DB: document_intelligence
    ports:
      # Host port only — the app talks to db:5432 inside the network. Override DI_DB_PORT in .env
      # if 5433 is taken on your machine.
      - "${DI_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U di -d document_intelligence"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DI_ENV: local
      PG_HOST: db
      PG_PORT: "5432"
      PG_USER: di
      PG_PASSWORD: di
      PG_DATABASE: document_intelligence
      PG_SCHEMA: di
      PG_HASH_PARTITIONS: "8"
      RLS_ENABLED: "false"          # demo connects as the DB owner; prod uses a non-superuser + RLS

      # --- Auth: on by default. This bootstrap key is seeded at startup and is what the console
      # --- and the smoke test use. Rotate/replace it for anything beyond a local demo.
      AUTH_ENABLED: "true"
      DI_BOOTSTRAP_API_KEY: "di_local_dev_key_change_me"

      # --- Blob storage: where the raw uploaded bytes live.
      # postgres (default) | local (docker volume at /data/blobs) | s3 (MinIO below) | none
      BLOB_BACKEND: ${BLOB_BACKEND:-postgres}
      BLOB_LOCAL_DIR: /data/blobs
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-document-intelligence}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_REGION: us-east-1

      DI_RETRIEVAL_STUB: "true"     # offline model gateway; set false + RETRIEVAL_BASE_URL for real
      RETRIEVAL_BASE_URL: ""        # e.g. http://host.docker.internal:8000 once its gateway is up
      RETRIEVAL_API_KEY: ""

      # Azure OCR (Computer Vision Read v3.2). Defaults to the local mock so the Azure code path is
      # exercised offline; override with your real resource:
      #   AZURE_VISION_ENDPOINT=https://<res>.cognitiveservices.azure.com/ AZURE_VISION_KEY=<key>
      AZURE_VISION_ENDPOINT: ${AZURE_VISION_ENDPOINT:-http://azure-ocr-mock:5000}
      AZURE_VISION_KEY: ${AZURE_VISION_KEY:-mock-key}

      EMBEDDING_DIM_DEFAULT: "768"
      AREP_ASYNC: "false"           # generate accessibility reps synchronously for the demo
      MASK_BY_DEFAULT: "true"       # fail-closed: sensitive values redacted unless asked for
      DI_LOG_LEVEL: INFO
    ports:
      # Console + API. Override DI_APP_PORT in .env if 8080 is taken on your machine.
      - "${DI_APP_PORT:-8080}:8080"
    volumes:
      - blobdata:/data/blobs        # used when BLOB_BACKEND=local
    depends_on:
      db:
        condition: service_healthy
      azure-ocr-mock:
        condition: service_healthy

  # Mock Azure OCR (Computer Vision Read v3.2) — plain Python + Tesseract, no Azure SDK.
  # Lets the app's Azure v3.2 HTTP client run end-to-end locally without a real Azure resource.
  azure-ocr-mock:
    build: ./mock_azure_ocr
    ports:
      - "5005:5000"          # host 5005 (macOS AirPlay squats on 5000); app uses the internal :5000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible object storage, for demonstrating BLOB_BACKEND=s3 with no AWS account.
  # Enable with:  docker compose --profile s3 up --build
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"          # S3 API
      - "9001:9001"          # MinIO console (browser UI)
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the bucket once MinIO is up, then exits.
  minio-init:
    image: minio/mc:latest
    profiles: ["s3"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-document-intelligence} &&
      echo 'bucket ready'
      "

volumes:
  pgdata: {}
  blobdata: {}
  miniodata: {}
