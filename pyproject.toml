[project]
name = "document-intelligence"
version = "0.1.0"
description = "Unified document-intelligence platform: per-client knowledge trees from KYC documents (US/CA/MX, EN/ES)."
requires-python = ">=3.11"
readme = "README.md"

# Core runtime — light, always installed. Heavy ML libs live in the optional [ml] group
# and are imported lazily so the app boots and pure-logic tests run without them.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",   # FastAPI multipart (file uploads on /ingest)
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "sse-starlette>=2.0",
    "structlog>=24.1",
    "prometheus-client>=0.20",   # /metrics exposition (gate decisions, LLM egress, stage timings)
    "python-stdnum>=1.20",   # CURP/RFC/SSN/SIN/EIN/PAN checksums
    "rapidfuzz>=3.6",        # label-anchored KV fuzzy matching
    "dateparser>=1.2",       # locale-aware date parsing
    "pycountry>=23.12",      # ISO country validation (MRZ)
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Document parsing / OCR / deterministic ID extraction
extract = [
    "mrz>=0.6",              # ICAO 9303 MRZ parsing/validation (passport)
    "pypdf>=4.0",            # PDF text-layer extraction (digital PDFs)
    "python-docx>=1.1",      # .docx text extraction
    "pillow>=10.0",          # image loading for OCR
    "pytesseract>=0.3.10",   # Tesseract OCR bindings (PNG/JPEG, scanned PDFs) — needs the tesseract binary
    "pdf2image>=1.17",       # rasterize scanned PDFs for OCR — needs poppler
]
# S3 / MinIO blob backend (lazy-imported; only needed when BLOB_BACKEND=s3)
s3 = [
    "boto3>=1.34",
]
# Local PII-safe classifier + PII gate (heavy; lazy-imported)
ml = [
    "lingua-language-detector>=2.0",
    "scikit-learn>=1.4",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
    "setfit>=1.0",
    "sentence-transformers>=2.7",
]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.9",
    "fpdf2>=2.7",            # generate digital-PDF test fixtures
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["di"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines tolerated in prompts/SQL

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs a live Postgres/S3; run with DI_RUN_INTEGRATION=1.",
    "db: requires a live Postgres (ltree).",
    "pgvector: requires pgvector extension (skipped if absent).",
    "ml: requires the optional [ml] dependency group.",
    "network: requires the retrieval service or Azure Vision.",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
