<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="KYC document-intelligence console — ingest, knowledge tree, merged facts, provenance." />
    <title>Document Intelligence — Console</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231E2761'/%3E%3Cpath d='M50 20 L74 34 L74 62 L50 80 L26 62 L26 34 Z' fill='none' stroke='%23C8860D' stroke-width='6' stroke-linejoin='round'/%3E%3Ccircle cx='50' cy='50' r='8' fill='%23CADCFC'/%3E%3C/svg%3E"
    />
    <script>
      // Set the theme before first paint so there is no flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('di.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.classList.add('theme-' + theme);
        } catch (e) {
          document.documentElement.classList.add('theme-light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
