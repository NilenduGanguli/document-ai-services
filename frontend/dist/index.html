<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document Intelligence — Console</title>
  <link rel="stylesheet" href="/assets/app.css?v=3" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%236366f1'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E2%97%86%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◆</span>
      <div>
        <div class="brand-title">Document Intelligence</div>
        <div class="brand-sub">KYC knowledge-tree console</div>
      </div>
    </div>
    <div class="topbar-controls">
      <label class="field">
        <span>Client ID</span>
        <input id="clientId" type="text" value="acme-bank-001" spellcheck="false" />
      </label>
      <label class="toggle" title="Apply the access-aware masking projection to responses">
        <input id="maskToggle" type="checkbox" />
        <span>Mask PII</span>
      </label>
      <span id="health" class="health" title="API health">●</span>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar">
      <button class="nav-item active" data-view="ingest"><i>⇪</i> Ingest</button>
      <button class="nav-item" data-view="documents"><i>▤</i> Documents</button>
      <button class="nav-item" data-view="tree"><i>⛬</i> Knowledge Tree</button>
      <button class="nav-item" data-view="facts"><i>≣</i> Merged Facts</button>
      <button class="nav-item" data-view="search"><i>⌕</i> Search</button>
      <button class="nav-item" data-view="manifest"><i>❖</i> Manifest</button>
      <div class="sidebar-foot">
        <span class="dot det"></span> deterministic &nbsp;
        <span class="dot llm"></span> to-LLM<br/>
        <span class="dot crit"></span> critical &nbsp;
        <span class="dot high"></span> high
      </div>
    </nav>

    <main id="main" class="main"><!-- views injected here --></main>
  </div>

  <div id="toast" class="toast"></div>
  <div id="modal" class="modal-backdrop" hidden>
    <div class="modal"><button class="modal-close" id="modalClose">×</button><div id="modalBody"></div></div>
  </div>

  <script src="/assets/app.js?v=3"></script>
</body>
</html>
